name: Build Tabdeal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout private application source
        uses: actions/checkout@v4
        with:
          repository: alisolimani3221-art/tabdeal-pro-bot
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source

      - name: Install Linux and Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk             autoconf automake autoconf-archive libtool libtool-bin m4 pkg-config             build-essential zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake             fonts-noto-core

      - name: Bundle Persian and Latin fonts
        working-directory: source
        run: |
          mkdir -p assets
          SANS_FONT="$(find /usr/share/fonts -type f -iname 'NotoSansArabic-Regular.ttf' -print -quit)"
          NASKH_FONT="$(find /usr/share/fonts -type f -iname 'NotoNaskhArabic-Regular.ttf' -print -quit)"
          LATIN_FONT="$(find /usr/share/fonts -type f -iname 'NotoSans-Regular.ttf' -print -quit)"
          if [ -n "$SANS_FONT" ]; then
            cp "$SANS_FONT" assets/NotoSansArabic-Regular.ttf
            cp "$SANS_FONT" NotoSansArabic-Regular.ttf
          fi
          if [ -n "$NASKH_FONT" ]; then
            cp "$NASKH_FONT" assets/NotoNaskhArabic-Regular.ttf
            cp "$NASKH_FONT" NotoNaskhArabic-Regular.ttf
          fi
          if [ -n "$LATIN_FONT" ]; then
            cp "$LATIN_FONT" assets/NotoSans-Regular.ttf
            cp "$LATIN_FONT" NotoSans-Regular.ttf
          fi
          test -s NotoSans-Regular.ttf
          test -s NotoSansArabic-Regular.ttf -o -s NotoNaskhArabic-Regular.ttf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        working-directory: source
        run: python -m unittest discover -s tests -v

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Install Persian RTL dependencies
        working-directory: source
        run: |
          python -m pip install --target vendor arabic-reshaper==3.0.0 python-bidi==0.4.2 future==1.0.0
          python -m pip install fonttools

      - name: Verify the exact runtime Persian font and RTL pipeline
        working-directory: source
        run: |
          PYTHONPATH=vendor python - <<'PY'
          import ast
          import os
          import arabic_reshaper
          from bidi.algorithm import get_display
          from fontTools.ttLib import TTFont

          # Match main.py's runtime preference exactly: Naskh before Sans.
          candidates = ["NotoNaskhArabic-Regular.ttf", "NotoSansArabic-Regular.ttf"]
          font_path = next((p for p in candidates if os.path.isfile(p)), None)
          if not font_path:
              raise SystemExit("No runtime Persian font found")
          font = TTFont(font_path)
          cmap = set().union(*(table.cmap.keys() for table in font["cmap"].tables))

          with open("main.py", encoding="utf-8") as f:
              source = f.read()
          tree = ast.parse(source)
          strings = [n.value for n in ast.walk(tree)
                     if isinstance(n, ast.Constant) and isinstance(n.value, str)]
          sample = "فارسی آزمایش پشتیبانی"
          strings.append(sample)
          shaped_codepoints = set()
          for value in strings:
              if any("\u0600" <= ch <= "\u06ff" or
                     "\u0750" <= ch <= "\u077f" or
                     "\u08a0" <= ch <= "\u08ff" for ch in value):
                  shaped_codepoints.update(map(ord, arabic_reshaper.reshape(value)))
          arabic_ranges = ((0x0600, 0x06FF), (0x0750, 0x077F), (0x08A0, 0x08FF),
                           (0xFB50, 0xFDFF), (0xFE70, 0xFEFF))
          required = {cp for cp in shaped_codepoints
                      if any(lo <= cp <= hi for lo, hi in arabic_ranges)}
          missing = sorted(required - cmap)
          if missing:
              raise SystemExit("Runtime font lacks required shaped glyphs: " +
                               " ".join("U+%04X" % cp for cp in missing))
          displayed = get_display(arabic_reshaper.reshape(sample))
          if not any(0xFB50 <= ord(ch) <= 0xFDFF or 0xFE70 <= ord(ch) <= 0xFEFF
                     for ch in displayed):
              raise SystemExit("Persian shaping/bidi smoke test failed")
          print("RTL pipeline OK; runtime font:", font_path,
                "; checked Arabic glyphs:", len(required))
          PY

      - name: Build debug APK
        working-directory: source
        run: buildozer android debug

      - name: Verify APK and upload
        working-directory: source
        run: |
          set -eu
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          unzip -l "$APK" | grep -Ei 'NotoSans|NotoNaskh|Roboto' || true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabdeal-Android-APK
          path: source/bin/*.apk
          if-no-files-found: error
          retention-days: 7
